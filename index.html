<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>คิดเลขพอดี</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#232733; --text:#e9ecf2; --dim:#8a91a3;
    --accent:#f2a33a; --accent-ink:#1b1206; --ok:#7fd6a4; --err:#ef7a7a; --key:#1e222c; --key2:#2a2f3b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
  .app{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
  header h1{font-size:17px;font-weight:600;margin:0;flex:1;letter-spacing:.2px}
  header h1 span{color:var(--accent)}
  .hbtn{background:var(--key);color:var(--dim);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .hbtn.icon{padding:6px 11px}
  .hbtn.warn{color:var(--err);border-color:var(--err)}
  .sheet{flex:1;overflow-y:auto;padding:4px 10px 8px}
  .row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:10px}
  .row.active{background:var(--panel)}
  .num{width:18px;color:#4c5366;font-size:11px;text-align:right;font-family:'JetBrains Mono',monospace}
  .row input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);
    font-family:'JetBrains Mono','IBM Plex Sans Thai',monospace;font-size:17px;padding:4px 0;caret-color:var(--accent)}
  .res{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--ok);white-space:nowrap;
    padding:3px 8px;border-radius:8px;background:rgba(127,214,164,.08);cursor:pointer;font-variant-numeric:tabular-nums}
  .res.var{color:var(--accent);background:rgba(242,163,58,.1)}
  .res.err{color:var(--err);background:none;font-size:13px}
  .res:empty{display:none}
  .summary{padding:6px 16px 4px;border-top:1px solid var(--line)}
  .sumrow{display:flex;align-items:baseline;gap:10px}
  .big{flex:1;font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:600;text-align:right;
    overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
  .words{color:var(--dim);font-size:13px;text-align:right;cursor:pointer}
  .words:empty{display:none}
  .total{color:var(--dim);font-size:11px;line-height:1.3;white-space:nowrap}
  .total b{display:block;font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:400}
  .chips{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);display:flex;gap:6px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--key2);color:var(--text);border:0;border-radius:999px;padding:8px 13px;
    font:inherit;font-size:14px;cursor:pointer}
  .chip.on{background:var(--accent);color:var(--accent-ink)}
  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:2px 10px calc(12px + env(safe-area-inset-bottom))}
  .k{height:clamp(44px,7.2dvh,58px);border:0;border-radius:16px;background:var(--key);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:22px;cursor:pointer;transition:transform .06s,background .1s}
  .k:active{transform:scale(.95);background:var(--key2)}
  .k.op{background:var(--key2);color:var(--accent)}
  .k.fn{color:var(--dim);font-size:18px}
  .k.go{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .toast{position:fixed;left:50%;bottom:40%;transform:translateX(-50%);background:#000c;color:#fff;
    padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .help{color:var(--dim);font-size:12px;padding:8px 14px;margin:0 10px 6px;line-height:1.5;background:var(--panel);border-radius:10px}
  .help[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>คิดเลข<span>พอดี</span></h1>
    <button class="hbtn icon" id="helpBtn" aria-label="วิธีใช้">?</button>
    <button class="hbtn" id="copyBtn">คัดลอก</button>
    <button class="hbtn" id="clearBtn">ล้างทั้งหมด</button>
  </header>
  <div class="sheet" id="sheet"></div>
  <div class="help" id="help" hidden>แตะบรรทัดไหนก็แก้ได้ ผลบรรทัดอื่นอัปเดตตาม · ตั้งชื่อด้วย <b>ชื่อ = ค่า</b> · <b>ans</b> = ผลบรรทัดก่อน · แตะผลสีเขียวเพื่อแทรกตัวเลข</div>
  <div class="summary">
    <div class="sumrow">
      <div class="total">รวมทุกบรรทัด<b id="total">0</b></div>
      <div class="big" id="big">0</div>
    </div>
    <div class="words" id="words" title="แตะเพื่อคัดลอก"></div>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-kbd>⌨ พิมพ์ชื่อ</button>
    <button class="chip" data-ins=" = ">=</button>
    <button class="chip" data-ins="(">(</button>
    <button class="chip" data-ins=")">)</button>
    <button class="chip" data-ins="ans">ans</button>
    <button class="chip" data-ins=" + 7%">+VAT 7%</button>
    <button class="chip" data-ins=" − 10%">−10%</button>
    <button class="chip" data-ins=" + 10%">+service 10%</button>
    <button class="chip" data-ins="^">xʸ</button>
    <button class="chip" data-ins="√">√</button>
  </div>
  <div class="pad" id="pad">
    <button class="k fn" data-act="ac">AC</button>
    <button class="k fn" data-act="bs">⌫</button>
    <button class="k op" data-ins="%">%</button>
    <button class="k op" data-ins=" ÷ ">÷</button>
    <button class="k" data-ins="7">7</button><button class="k" data-ins="8">8</button><button class="k" data-ins="9">9</button>
    <button class="k op" data-ins=" × ">×</button>
    <button class="k" data-ins="4">4</button><button class="k" data-ins="5">5</button><button class="k" data-ins="6">6</button>
    <button class="k op" data-ins=" − ">−</button>
    <button class="k" data-ins="1">1</button><button class="k" data-ins="2">2</button><button class="k" data-ins="3">3</button>
    <button class="k op" data-ins=" + ">+</button>
    <button class="k" data-ins="00">00</button><button class="k" data-ins="0">0</button><button class="k" data-ins=".">.</button>
    <button class="k go" data-act="nl">↵</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'kidlek-pordee-v1';
  const sheet = document.getElementById('sheet');
  let active = null, kbdMode = false;

  /* ---------- parser (no eval) ---------- */
  const IDENT = /[A-Za-z_฀-๿][A-Za-z0-9_฀-๿]*/y;
  function tokenize(s){
    s = s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
    const t = []; let i = 0;
    while (i < s.length){
      const c = s[i];
      if (c === ' ' || c === ',') { i++; continue; }
      if (/[0-9.]/.test(c)){ let j=i; while(j<s.length && /[0-9.,]/.test(s[j])) j++;
        const n = s.slice(i,j).replace(/,/g,''); if (isNaN(+n)) throw 0; t.push({k:'n',v:+n}); i=j; continue; }
      IDENT.lastIndex = i; const m = IDENT.exec(s);
      if (m){ t.push({k:'id',v:m[0]}); i += m[0].length; continue; }
      if ('+-*/^()%√'.includes(c)){ t.push({k:c}); i++; continue; }
      throw 0;
    }
    return t;
  }
  function evaluate(src, vars){
    const t = tokenize(src); let p = 0;
    const peek = () => t[p] && t[p].k, eat = k => { if (peek()!==k) throw 0; return t[p++]; };
    function add(){
      let L = mul(), single = true;
      while (peek()==='+' || peek()==='-'){
        const op = t[p++].k, R = mul(); single = false;
        if (R.pct) L = {v: L.v * (op==='+' ? 1+R.v : 1-R.v)};
        else L = {v: op==='+' ? L.v+R.v : L.v-R.v};
      }
      return single ? L : {v:L.v};
    }
    function mul(){
      let L = unary(), single = true;
      while (peek()==='*' || peek()==='/'){
        const op = t[p++].k, R = unary(); single = false;
        L = {v: op==='*' ? L.v*R.v : L.v/R.v};
      }
      return single ? L : {v:L.v};
    }
    function unary(){
      if (peek()==='-'){ p++; const r = unary(); return {v:-r.v, pct:r.pct}; }
      if (peek()==='+'){ p++; return unary(); }
      if (peek()==='√'){ p++; return {v:Math.sqrt(unary().v)}; }
      return pow();
    }
    function pow(){
      const b = postfix();
      if (peek()==='^'){ p++; return {v: Math.pow(b.v, unary().v)}; }
      return b;
    }
    function postfix(){
      const r = primary();
      if (peek()==='%'){ p++; return {v:r.v/100, pct:true}; }
      return r;
    }
    function primary(){
      const k = peek();
      if (k==='n') return {v:t[p++].v};
      if (k==='id'){ const name = t[p++].v; if (!(name in vars)) throw {unknown:name}; return {v:vars[name]}; }
      if (k==='('){ p++; const r = add(); if (peek()===')') p++; return {v:r.v}; }
      throw 0;
    }
    if (!t.length) return null;
    const r = add(); if (p < t.length) throw 0;
    return r.v;
  }

  /* ---------- formatting ---------- */
  function fmt(v){
    if (v === null || v === undefined) return '';
    if (!isFinite(v)) return isNaN(v) ? 'ไม่ได้' : (v>0?'∞':'-∞');
    const r = parseFloat(v.toPrecision(12)), a = Math.abs(r);
    if (a >= 1e15 || (a>0 && a<1e-9)) return r.toExponential(6);
    return r.toLocaleString('en-US',{maximumFractionDigits:10});
  }
  const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'], P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  function read6(s){
    s = s.replace(/^0+/,''); let out='';
    for (let i=0;i<s.length;i++){
      const d=+s[i], pos=s.length-1-i; if (!d) continue;
      if (pos===1 && d===1) out+='สิบ';
      else if (pos===1 && d===2) out+='ยี่สิบ';
      else if (pos===0 && d===1 && s.length>1) out+='เอ็ด';
      else out+=D[d]+P[pos];
    }
    return out;
  }
  function readInt(s){
    s = s.replace(/^0+/,''); if (!s) return '';
    if (s.length>6) return readInt(s.slice(0,-6))+'ล้าน'+read6(s.slice(-6));
    return read6(s);
  }
  function bahtText(v){
    if (v===null || !isFinite(v) || Math.abs(v)>=1e13) return '';
    const neg = v<0; const [i,f] = Math.abs(v).toFixed(2).split('.');
    let out = '';
    if (+i===0 && +f===0) return 'ศูนย์บาทถ้วน';
    if (+i>0) out += readInt(i)+'บาท';
    out += +f>0 ? readInt(f)+'สตางค์' : 'ถ้วน';
    return (neg?'ลบ':'')+out;
  }

  /* ---------- lines ---------- */
  function rowEl(text=''){
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = '<span class="num"></span><input autocomplete="off" autocorrect="off" spellcheck="false"><span class="res"></span>';
    const inp = row.querySelector('input');
    inp.value = text; inp.inputMode = kbdMode ? 'text' : 'none';
    inp.addEventListener('focus', () => setActive(row));
    inp.addEventListener('input', recompute);
    inp.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); newLine(); } });
    const res = row.querySelector('.res');
    res.addEventListener('pointerdown', e => {
      e.preventDefault(); if (row._val==null || !active || active===row) return;
      insert(String(parseFloat(row._val.toPrecision(12))));
    });
    return row;
  }
  const rows = () => [...sheet.children];
  function setActive(row){
    rows().forEach(r => r.classList.toggle('active', r===row));
    active = row; showSummary();
  }
  function recompute(){
    const vars = {}; let prev = 0, total = 0;
    rows().forEach((row,i) => {
      row.querySelector('.num').textContent = i+1;
      const src = row.querySelector('input').value, res = row.querySelector('.res');
      res.className = 'res'; row._val = null;
      if (!src.trim() || src.trim().startsWith('#')){ res.textContent=''; return; }
      vars.ans = prev;
      const m = src.match(/^\s*([A-Za-z_฀-๿][A-Za-z0-9_฀-๿]*)\s*=\s*(.*)$/);
      try{
        const v = evaluate(m ? m[2] : src, vars);
        if (v===null){ res.textContent=''; return; }
        row._val = v; prev = v; if (isFinite(v)) total += v;
        if (m){ vars[m[1]] = v; res.classList.add('var'); }
        res.textContent = fmt(v);
      }catch(e){
        res.classList.add('err');
        res.textContent = e && e.unknown ? 'ไม่รู้จัก “'+e.unknown+'”' : '…';
      }
    });
    document.getElementById('total').textContent = fmt(total);
    showSummary(); save();
  }
  function showSummary(){
    const v = active ? active._val : null;
    document.getElementById('big').textContent = v==null ? '0' : fmt(v);
    document.getElementById('words').textContent = v==null ? '' : bahtText(v);
  }
  function newLine(after=active, text=''){
    const r = rowEl(text);
    after && after.nextSibling ? sheet.insertBefore(r, after.nextSibling) : sheet.appendChild(r);
    r.querySelector('input').focus(); setActive(r); recompute();
    r.scrollIntoView({block:'nearest'});
  }
  function insert(txt){
    if (!active) return; const inp = active.querySelector('input');
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
    inp.setRangeText(txt, s, e, 'end'); inp.focus(); recompute();
  }
  function backspace(){
    if (!active) return; const inp = active.querySelector('input');
    if (!inp.value && rows().length>1){
      const prev = active.previousSibling || active.nextSibling; active.remove();
      const pi = prev.querySelector('input'); pi.focus(); pi.setSelectionRange(pi.value.length,pi.value.length);
      setActive(prev); recompute(); return;
    }
    let s = inp.selectionStart, e = inp.selectionEnd;
    if (s===e){ if (!s) return; s--; while (s>0 && inp.value[s]===' ' ) s--; }
    inp.setRangeText('', s, e, 'end'); recompute();
  }

  /* ---------- storage ---------- */
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(rows().map(r=>r.querySelector('input').value))); }catch(e){} }
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }

  /* ---------- input wiring ---------- */
  const buzz = () => { try{ navigator.vibrate && navigator.vibrate(8); }catch(e){} };
  function press(btn){
    buzz();
    if (btn.dataset.ins!==undefined) return insert(btn.dataset.ins);
    if (btn.dataset.kbd!==undefined){
      kbdMode = !kbdMode; btn.classList.toggle('on', kbdMode);
      rows().forEach(r => r.querySelector('input').inputMode = kbdMode?'text':'none');
      if (active){ const i = active.querySelector('input'); i.blur(); setTimeout(()=>i.focus(),30); }
      return;
    }
    const a = btn.dataset.act;
    if (a==='ac'){ if(active){ active.querySelector('input').value=''; recompute(); } }
    if (a==='bs') backspace();
    if (a==='nl') newLine();
  }
  document.querySelectorAll('.k,.chip').forEach(b => {
    b.addEventListener('pointerdown', e => e.preventDefault()); // keep caret in the line
    b.addEventListener('click', () => press(b));
  });

  const toast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1300); };
  async function copy(text, msg){ try{ await navigator.clipboard.writeText(text); toast(msg); }catch(e){ toast('คัดลอกไม่ได้ในหน้านี้'); } }
  document.getElementById('copyBtn').onclick = () => copy(rows().map(r=>{
    const s=r.querySelector('input').value, v=r.querySelector('.res').textContent; return v? s+'  →  '+v : s; }).join('\n'), 'คัดลอกการคำนวณแล้ว');
  document.getElementById('words').onclick = e => e.target.textContent && copy(e.target.textContent,'คัดลอกคำอ่านแล้ว');
  const clearBtn = document.getElementById('clearBtn'); let armed = null;
  clearBtn.onclick = () => {
    if (!armed){ clearBtn.textContent='แตะอีกครั้งเพื่อล้าง'; clearBtn.classList.add('warn');
      armed = setTimeout(()=>{ armed=null; clearBtn.textContent='ล้างทั้งหมด'; clearBtn.classList.remove('warn'); },2500); return; }
    clearTimeout(armed); armed=null; clearBtn.textContent='ล้างทั้งหมด'; clearBtn.classList.remove('warn');
    sheet.innerHTML=''; active=null; newLine(null);
  };

  const help = document.getElementById('help');
  document.getElementById('helpBtn').onclick = () => { help.hidden = !help.hidden; };
  try{ if (!localStorage.getItem(KEY+'-seen')){ help.hidden = false; localStorage.setItem(KEY+'-seen','1'); } }catch(e){}

  /* ---------- start ---------- */
  const start = load() || ['# ลองแตะแก้บรรทัดไหนก็ได้','ค่าห้อง = 3500','ค่าไฟ = 812.5','(ค่าห้อง + ค่าไฟ) ÷ 2','1250 + 7%','ans − 10%',''];
  start.forEach(s => sheet.appendChild(rowEl(s)));
  const last = rows()[rows().length-1]; recompute(); last.querySelector('input').focus(); setActive(last);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
